[package]
name = "hmi"
version = "0.1.0"
authors = ["pumpkinstein <hannes.moritz@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
vda5050-data-types = { path = "../vda5050-data-types"}
log-file-parser = { path = "../log-file-parser"}

dioxus = { version = "0.7.10", features = ["router"] }
dioxus-free-icons = { version = "0.10.0", features = ["bootstrap"] }
once_cell = "1.21.0"
polars = { workspace = true }
rfd = "0.17.2"
sysinfo = "0.39.0"
tokio = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.5.54", features = ["derive"] }
dirs = "6.0.0"
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gdkwayland-sys = { version = "0.18.2", features = ["v3_24_22"] }
gtk = "0.18.2"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
