[workspace]
resolver = "3"
members = ["hmi", "log-file-parser", "vda5050-data-types"]

[workspace.dependencies]
# High-performance JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
simd-json = "0.17" # Optional: Requires RUSTFLAGS="-C target-feature=+avx2"

# Fast I/O and Byte manipulation
memmap2 = "0.9"
bstr = "1.12"
nom = "8.0"

# Parallelism
rayon = "1.11"

# Data Analysis
polars = { version = "0.52", features = ["lazy", "temporal", "dtype-datetime"] }
